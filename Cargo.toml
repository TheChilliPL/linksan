[package]
name = "linksan"
version = "0.1.0"
edition = "2024"

[dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
eyre = "0.6.14"
color-eyre = "0.6.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
showfile = "0.1.1"
notify-rust = "4.18.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
url = "2.5.8"
